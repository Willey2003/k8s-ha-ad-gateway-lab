name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Shell syntax check (bash -n)
        run: |
          set -e
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -I{} bash -n {}
      - name: Byte-compile Python helpers
        run: |
          set -e
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 -I{} python -m py_compile {}
